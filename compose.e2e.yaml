# Optional isolated real-API browser suite; never changes the demo API or its data.
services:
  agent-test-api:
    image: bid-intelligence-api-test:phase1
    working_dir: /workspace
    command: ['node', 'tests/support/e2e-server.ts']
    environment:
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      APP_ORIGIN: http://agent-test-web
      PHASE3_TEST_PREFIX: ${PHASE3_TEST_PREFIX:-}
      PHASE3_READ_EXISTING_DATA: ${PHASE3_READ_EXISTING_DATA:-}
    depends_on:
      postgres:
        condition: service_healthy
      dynamodb:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 4s
      retries: 30
    stop_grace_period: 30s

  agent-test-web:
    image: bid-intelligence-web-e2e:phase1
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      target: runtime
    volumes:
      - ./docker/nginx.e2e.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      agent-test-api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--spider', 'http://127.0.0.1/health']
      interval: 2s
      timeout: 4s
      retries: 10

  web:
    environment:
      WEB_BASE_URL: http://agent-test-web
      AGENT_E2E: 'true'
      PHASE3_TEST_PREFIX: ${PHASE3_TEST_PREFIX:-}
      PHASE3_READ_EXISTING_DATA: ${PHASE3_READ_EXISTING_DATA:-}
      PHASE3_TEST_PASSWORD_A: ${PHASE3_TEST_PASSWORD_A:-}
      PHASE3_TEST_PASSWORD_B: ${PHASE3_TEST_PASSWORD_B:-}
